# A check of the handshake fix of PR 15027 on the fork only. It is not part of the PR.
name: handshake check

on:
  push:
    branches: ["ci/handshake-check*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
      - name: Install
        run: for i in 1 2 3; do yarn && break; sleep 5; done
      - name: Build
        run: yarn build
      - name: eslint on the changed files, and the changes of Prettier
        if: always()
        working-directory: packages/api-graphql
        run: |
          set -o pipefail
          files="src/Providers/AWSWebSocketProvider/index.ts __tests__/AWSAppSyncRealTimeProvider.test.ts"
          npx eslint $files 2>&1 | tee "$RUNNER_TEMP/lint.txt"
          # Lines of main fail the Prettier check too, so this part only records the changes that Prettier makes
          npx prettier --version | tee -a "$RUNNER_TEMP/lint.txt"
          npx prettier --write $files > /dev/null
          git diff -U0 -- $files | tee -a "$RUNNER_TEMP/lint.txt"
          git checkout -- $files
      - name: The api-graphql suite with the fix
        if: always()
        working-directory: packages/api-graphql
        run: |
          set -o pipefail
          npx jest -w 1 2>&1 | tee "$RUNNER_TEMP/suite-fix.txt"
      - name: The new tests on the source of the first commit of the PR (expect failures)
        if: always()
        working-directory: packages/api-graphql
        run: |
          git checkout 923b305 -- src/Providers/AWSWebSocketProvider/index.ts
          npx jest -w 1 --testTimeout=10000 --forceExit __tests__/AWSAppSyncRealTimeProvider.test.ts -t "a handshake that fails before the retry" > "$RUNNER_TEMP/new-tests-on-pr-v1.txt" 2>&1 || true
          tail -60 "$RUNNER_TEMP/new-tests-on-pr-v1.txt"
      - name: The new tests on the source of main (expect failures)
        if: always()
        working-directory: packages/api-graphql
        run: |
          git checkout 9e01896 -- src/Providers/AWSWebSocketProvider/index.ts
          npx jest -w 1 --testTimeout=10000 --forceExit __tests__/AWSAppSyncRealTimeProvider.test.ts -t "a handshake that fails before the retry" > "$RUNNER_TEMP/new-tests-on-main.txt" 2>&1 || true
          tail -60 "$RUNNER_TEMP/new-tests-on-main.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: handshake-check
          path: ${{ runner.temp }}/*.txt
